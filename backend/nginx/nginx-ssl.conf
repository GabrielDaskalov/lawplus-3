# ============================================================
# Law+ — nginx с HTTPS (Let's Encrypt)
#
# АКТИВИРАНЕ (след като init-letsencrypt.sh издаде сертификата):
#   1. В docker-compose.prod.yml смени nginx.conf → nginx-ssl.conf
#   2. Замени ДОМЕЙН с истинския домейн (2 места)
#   3. docker compose -f docker-compose.prod.yml restart web
# ============================================================

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 6;

# HTTP → HTTPS пренасочване (+ Let's Encrypt подновяване)
server {
    listen 80;
    server_name ДОМЕЙН;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ДОМЕЙН;

    ssl_certificate     /etc/letsencrypt/live/ДОМЕЙН/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ДОМЕЙН/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    # Само админ качването на съдържание приема голям payload (PA_DATA ~12MB)
    location /api/admin/content {
        client_max_body_size 25m;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhooks/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location /health {
        proxy_pass http://api:3000/health;
    }

    # Данните (12MB) — кешират се 1 ден; при нова версия ETag ги обновява
    location = /pravo-academy-data.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
